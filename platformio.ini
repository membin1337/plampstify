; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared by every [env:*] below. Library sources are pinned to exact
; owner/repo (rather than bare names like "AsyncTCP") because PlatformIO's
; library manager resolved the bare name ambiguously when a second
; environment was added - it pulled in a Raspberry Pi Pico W variant of
; AsyncTCP instead of the ESP32 one, breaking the build. Pinning avoids that.
[env]
platform = espressif32
board = esp-wrover-kit
framework = arduino
lib_deps =
	https://github.com/mathieucarbou/ESPAsyncWebServer.git
	https://github.com/ESP32Async/AsyncTCP.git
	ArduinoJson
	DHT sensor library
	paulstoffregen/OneWire
	milesburton/DallasTemperature
	https://github.com/WifWaf/MH-Z19.git

; USB upload (default). Use this for the very first upload after adding OTA
; support - the device needs OTA-capable code running before it can accept
; wireless uploads.
[env:esp-wrover-kit]

; Wireless upload - use this env for every upload after the first one above.
; Run with:
;   pio run -e esp-wrover-kit-ota -t upload
; This env's first build after any `.pio/build` cleanup is prone to a
; stale/incomplete ESPAsyncWebServer .a archive (link errors:
; "undefined reference to AsyncWebServerRequest::..." even though the
; source compiles fine) - a plain retry doesn't fix it since nothing
; about the source changed, only a clean rebuild does. Prefer:
;   ./scripts/ota-upload.sh
; which retries automatically and cleans this env's build dir when it
; detects that specific failure.
[env:esp-wrover-kit-ota]
upload_protocol = espota
; mDNS hostname, not a hardcoded IP - wifi_manager.cpp's startOTA() already
; calls ArduinoOTA.begin() with setHostname("plampstify"), which starts
; mDNS.begin() every OTA session regardless of which WiFi network the
; device landed on (see the multi-SSID fallback in secrets.h/wifi_manager.
; cpp) - so this resolves correctly even after a fallback/DHCP address
; change, no manual IP lookup needed. Requires your machine's OS to
; support .local mDNS resolution (Avahi on Linux, Bonjour on Mac/Windows -
; commonly preinstalled, but verify). If it doesn't resolve, fall back to
; a hardcoded IP here (see scripts/read-esp32-ip.py to find the current
; one off USB serial).
upload_port = plampstify.local
; --timeout raises espota's wait for the device to answer the initial
; invitation (default 10s) - gives it more room if loop() happened to be
; mid-way through something blocking (e.g. server_report.cpp's check-in
; POST, up to 5s) right when the invite arrived. Doesn't help the actual
; data transfer, though: that's a separate, hardcoded 10s-per-1KB-chunk
; timeout inside espota.py itself with no config knob at all - on a
; lossy/high-jitter link (see TODO.md's WiFi-fallback entries) that's the
; more likely failure point across the ~1000 round-trips a full image
; needs, and no platformio.ini setting can raise it.
upload_flags =
	--auth=plamp-ota          ; <-- must match otaPassword in main.cpp
	--timeout=30
